{% extends 'layouts/base.html' %}

{% block title %} {% endblock title %}

<!-- Specific CSS goes HERE -->
{% block stylesheets %}{% endblock stylesheets %}

{% block content %}

    <div class="container-fluid py-4">
        <div class="container mt-5">
            <div class="card shadow-lg border-0 rounded-lg">
                <div class="card-header"><h3 class="text-center font-weight-light my-1">Add Url</h3></div>
                <div class="card-body">
                    <form method="post" action="{{ url_for('home_blueprint.url') }}">
                         <div class="form-group">
                            <label class="small mb-1" for="category">Name</label>
                            <input value="{{ data.name }}" class="form-control py-1" id="name" name="name" type="text"
                                   placeholder="Enter name" required/>
                        </div>
                        <div class="form-group">
                            <label class="small mb-1" for="category"> Url</label>
                            <input value="{{ data.url }}" class="form-control py-1" id="url" name="url" type="text"
                                   placeholder="Enter Url (For Multiple URLs enter comma seperated)" required/>
                        </div>
                        <div class="form-group d-flex align-items-center justify-content-between mt-4 mb-0">
                            <button class="btn btn-danger" type="submit">Start Crawling</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        {% include "includes/footer.html" %}

    </div>

{% endblock content %}

<!-- Specific JS goes HERE -->
{% block javascripts %}

{% endblock javascripts %}
