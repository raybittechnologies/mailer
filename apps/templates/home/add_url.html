{% extends 'layouts/base.html' %}

{% block title %} {% endblock title %}

<!-- Specific CSS goes HERE -->
{% block stylesheets %}
{% endblock stylesheets %}

{% block content %}

    <div class="container-fluid py-4">
        <div class="container mt-5">
            <div class="card shadow-lg border-0 rounded-lg">
                <div class="card-header"><h3 class="text-center font-weight-light my-1">Search</h3></div>
                <div class="card-body">
                    <form method="post" action="{{ url_for('home_blueprint.url') }}" id="search_form">
                        <input type="hidden" name="csrf_token" id="csrf_token" value="{{ csrf_token() }}">
                         <div class="form-group">
                            <label class="small mb-1" for="business">Business Type</label>
                            <input class="form-control py-1" id="business" name="business" type="text"
                                   placeholder="things to do, nail salons, plumbers, Live Music" multiple size="10" required/>
                        </div>
                        <div class="form-group">
                            <label class="small mb-1" for="location">Location</label>
                            <input class="form-control py-1" id="location" name="location" type="text"
                                   placeholder="address, neighborhood, city, state or zip"  multiple size="10" required/>
                            
                            <input type="hidden" id="latitude" name="latitude" >
                            <input type="hidden" id="longitude" name="longitude">

                        </div>
                        <div class="form-group d-flex align-items-center justify-content-between mt-4 mb-0">
                            <button class="btn btn-danger" type="submit">Start Processes</button>
                        </div>
                    </form>
                </div>
            </div>
            <!-- <div id="map" style="height: 400px; width: 100%; padding-top: 20px;"></div> -->
        </div>

        {% include "includes/footer.html" %}

    </div>

{% endblock content %}

<!-- Specific JS goes HERE -->
{% block javascripts %}

<script src="https://code.jquery.com/jquery-3.5.1.js"></script>
<script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA1gJVpuNrhHJXNYmm_zikTZgmADxo1mDY&loading=async&libraries=places,maps,marker&v=beta" defer></script>
<script>
    
    $(document).ready(function () {

        let map;
        let marker;
        let autocomplete;

        function initAutocomplete() {
            // Initialize the map centered on a default location
            // map = new google.maps.Map(document.getElementById('map'), {
            //     // Default to new york
            //     center: { lat: 40.7128, lng: -74.0060 },
            //     zoom: 13,
            //     mapId: "RBA_MAP_ID"
            // });

            // Create the autocomplete object, restricting the search to geographical location types
            autocomplete = new google.maps.places.Autocomplete(
                document.getElementById('location'),
                { 
                    types: ['geocode'], 
                    componentRestrictions: { country: 'us' } ,
                    fields: ['geometry', 'formatted_address']
                }
            );

            // When the user selects an address from the dropdown, update the map
            autocomplete.addListener('place_changed', onPlaceChanged);
        }
    
        // When the user selects an address from the dropdown, populate the address fields in the form.
        function onPlaceChanged() {
            const place = autocomplete.getPlace();

            console.log(place);

            // print latitude and longitude to the input fields by converting the place.geometry.location.lat() and place.geometry.location.lng() to string
            document.getElementById('latitude').value = place.geometry.location.lat();
            document.getElementById('longitude').value = place.geometry.location.lng();

            // if (!place.geometry) {
            //     // User entered the name of a Place that was not suggested and
            //     // pressed the Enter key, or the Place Details request failed.
            //     window.alert("No details available for input: '" + place.name + "'");
            //     return;
            // }

            // // If the place has a geometry, then present it on a map
            // if (place.geometry.viewport) {
            //     map.fitBounds(place.geometry.viewport);
            // } else {
            //     map.setCenter(place.geometry.location);
            //     map.setZoom(17); // Why 17? Because it looks good.
            // }

            // // Set the marker at the new location
            // if (marker) {
            //     marker.setMap(null);
            // }
            // marker = new google.maps.Marker({
            //     map: map,
            //     position: place.geometry.location,
            //     draggable: true,
            //     zoom: 15
            // });
        }

        window.onload = function () {
            initAutocomplete();
        };

        // Catch form submit and validate
        $('#search_form').submit(function (e) {
            e.preventDefault();

            let business = $('#business').val();
            let location = $('#location').val();
            let latitude = $('#latitude').val();
            let longitude = $('#longitude').val();
            let csrf_token = $('#csrf_token').val();

            let formdata = new FormData();
            formdata.append('business', business);
            formdata.append('location', location);
            formdata.append('latitude', latitude);
            formdata.append('longitude', longitude);
            formdata.append('csrf_token', csrf_token);

            if (business === '' || location === '' || latitude === '' || longitude === '') {
                Swal.fire({
                    icon: 'error',
                    title: 'Updated',
                    text: 'Please fill in all fields',
                });
                return false;
            }

            // Fetch data
            fetch("{{ url_for('home_blueprint.url') }}", {
                method: 'POST',
                body: formdata
            }).then(response => response.json())
                .then(data => {
                    console.log(data);
                    if (data.success) {
                        Swal.fire({
                            icon: 'success',
                            title: 'Success',
                            html: '<p>Your search has been successfully started. You will be notified via email once the search has been completed.</p>',
                            showConfirmButton: false,
                            timer: 3000
                        });
                        url_id = data.url_id;

                        // redirect to the /fetch/<url_id> page
                        window.location.href = data.redirect;
                        
                    } else {
                        Swal.fire({
                            icon: 'error',
                            title: 'Error',
                            html: '<p><b>Only one search at a time.</b><br>Please wait for your running search to complete (recommended), or you can end it manually.<br>Go to "Data History" tab to see status, or to end current running search.<br>Please note: You will be notified via email once the current running search has been completed.<br>This will also act as your cue to start your next search.</p>',
                        });
                    }
                })
                .catch((error) => {
                    console.error('Error:', error);
                });
        });

    });


</script>
{% endblock javascripts %}
