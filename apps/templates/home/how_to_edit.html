{% extends 'layouts/admin.html' %}

{% block title %} Profile {% endblock title %}

<!-- Specific CSS goes HERE -->
{% block stylesheets %}
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
{% endblock stylesheets %}

{% block content %}

<div class="container-fluid">

    <form action="/update_howto" method="post" id="action-form">
        <div class="d-flex justify-content-end mt-5">
            <input class="btn bg-gradient-primary" type="submit" tabindex="0" value="Update">
        </div>
        <div class="card card-body blur shadow-blur mx-4 mt-4 overflow-hidden ">
            <div class="row gx-12">
                <div class="form-group">
                    <div id="quilleditor" class="form-control" style="width: 100%;" required ></div>
                </div>
                <div class="form-group">
                    <input type="text" class="form-control" id="howtotext_id" value="" name="howtotext_id" hidden>
                </div>
            </div>
        </div>
    </form>
</div>

<div class="container-fluid py-4">
</div>

{% include "includes/footer.html" %}

{% endblock content %}

<!-- Specific JS goes HERE -->
{% block javascripts %}
<script src="https://code.jquery.com/jquery-3.5.1.js"></script>
<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
<script>

    $(document).ready(function () {

        fetch('/get_howto_text', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                },
        }).then(response => {
            if(!response.ok)
                return response.text().then(text => { throw new Error(text) })
            else
                return response.json()
        }).then(data => {
            console.log(data);
            document.getElementsByClassName("ql-editor")[0].innerHTML = data.text;
            document.getElementById("howtotext_id").value = data.id;
            // document.getElementById("faq-contents").innerHTML = data.text;

        }).catch(error => {
            console.error(error);
        });
        
        
        var quill = new Quill('#quilleditor', {
            theme: 'snow', 
            modules: {
                toolbar: [
                    [{ 'font': [] }],
                    [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
                    ['bold', 'italic', 'underline'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    [{ 'indent': '-1'}, { 'indent': '+1' }, { 'align': [] }],
                    ["link", 'image', 'video'],
                    [{ 'align': [] }],
                ]
            }
        });

        $('#action-form').on('submit', function (e) { //use on if jQuery 1.7+
            e.preventDefault();  //prevent form from submitting
            const text = quill.root.innerHTML;
            const howtotext_id = document.getElementById("howtotext_id").value;

            Swal.fire({
                title: 'Updating How-To Checklist & FAQ',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading()
                },
            });

            fetch('/update_howto_text', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    "text": text,
                    "id": howtotext_id,
                }),
            })
                .then((response) => {
                    if (!response.ok)
                        return response.text().then(text => { throw new Error(text) })
                    else
                        return response.json()
                })
                .then((data) => {
                    if (data.success) {
                        console.log(data);
                        Swal.fire({
                            title: 'Success',
                            text: 'How-To Checklist & FAQ updated successfully',
                            icon: 'success',
                            confirmButtonText: 'Ok'
                        });
                        // document.getElementById("faq-contents").innerHTML = text;


                    } else {
                        Swal.fire({
                            title: 'Error',
                            text: 'An error occurred. Please try again',
                            icon: 'error',
                            confirmButtonText: 'Ok'
                        });
                    }
                })
                .catch((error) => {
                    console.error('Error:', error);
                    Swal.fire({
                        title: 'Error',
                        text: 'An error occurred. Please try again',
                        icon: 'error',
                        confirmButtonText: 'Ok'
                    });
                });

            $('#close-modal').click();
        });


    });
</script>


{% endblock javascripts %}
