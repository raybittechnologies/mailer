{% extends 'layouts/base.html' %}

{% block title %} {% endblock title %}

<!-- Specific CSS goes HERE -->
{% block stylesheets %}
{% endblock stylesheets %}

{% block content %}

    <div class="container-fluid py-4">
        <div class="container mt-5">
            <div class="card shadow-lg border-0 rounded-lg">
                <div class="card-header"><h3 class="text-center font-weight-light my-1">Search</h3></div>
                <div class="card-body">
                    <form method="post" action="{{ url_for('home_blueprint.url') }}">
                        <input type="hidden" name="csrf_token" id="csrf_token" value="{{ csrf_token() }}">
                         <div class="form-group">
                            <label class="small mb-1" for="business">Business Type</label>
                            <input class="form-control py-1" id="business" name="business" type="text"
                                   placeholder="things to do, nail salons, plumbers, Live Music" multiple size="10" required/>
                        </div>
                        <div class="form-group">
                            <label class="small mb-1" for="location">Location</label>
                            <input class="form-control py-1" id="location" name="location" type="text"
                                   placeholder="address, neighborhood, city, state or zip"  multiple size="10" required/>
                            
                            <input type="hidden" id="latitude" name="latitude" >
                            <input type="hidden" id="longitude" name="longitude">

                        </div>
                        <div class="form-group d-flex align-items-center justify-content-between mt-4 mb-0">
                            <button class="btn btn-danger" type="submit">Start Processes</button>
                        </div>
                    </form>
                </div>
            </div>
            <!-- <div id="map" style="height: 400px; width: 100%; padding-top: 20px;"></div> -->
        </div>

        {% include "includes/footer.html" %}

    </div>

{% endblock content %}

<!-- Specific JS goes HERE -->

<script src="https://code.jquery.com/jquery-3.5.1.js"></script>
<script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA1gJVpuNrhHJXNYmm_zikTZgmADxo1mDY&loading=async&libraries=places,maps,marker&v=beta" defer></script>
<script>
    
    $(document).ready(function () {

        let map;

        function initAutocomplete() {
            // Initialize the map centered on a default location

            //     zoom: 13,

            // Create the autocomplete object, restricting the search to geographical location types
            autocomplete = new google.maps.places.Autocomplete(
                document.getElementById('location'),
                { 
                    types: ['geocode'], 
                    componentRestrictions: { country: 'us' } ,
                    fields: ['geometry', 'formatted_address']
                }
            );

            // When the user selects an address from the dropdown, update the map
            autocomplete.addListener('place_changed', onPlaceChanged);
        }
    
        // When the user selects an address from the dropdown, populate the address fields in the form.
        function onPlaceChanged() {
            const place = autocomplete.getPlace();

            console.log(place);

            // print latitude and longitude to the input fields by converting the place.geometry.location.lat() and place.geometry.location.lng() to string
            document.getElementById('latitude').value = place.geometry.location.lat();
            document.getElementById('longitude').value = place.geometry.location.lng();

            // if (!place.geometry) {

            // // Set the marker at the new location

        }

        window.onload = function () {

    });


</script>
