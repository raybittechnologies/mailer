{% extends 'layouts/base.html' %}

{% block title %} {% endblock title %}

<!-- Specific CSS goes HERE -->
{% block stylesheets %}
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/fixedheader/3.3.2/css/fixedHeader.bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.4.1/css/responsive.bootstrap.min.css">
{% endblock stylesheets %}

{% block content %}

    <div class="container-fluid py-4">
        <div class="container mt-5">
            <div class="card shadow-lg border-0 rounded-lg">
                <div class="card-header"><h3 class="text-center font-weight-light my-1">Contacts</h3></div>
                <div class="card-body">
                    <table style="width:100%" id="filtersTable" class="table table-striped table-bordered nowrap">
                        <thead>
                        <tr>
                            <th>Venue</th>
                            <th>Email</th>
                            <th>Subscribed</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- Rows will be added dynamically using JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        {% include "includes/footer.html" %}

    </div>

{% endblock content %}

<!-- Specific JS goes HERE -->
{% block javascripts %}
<script src="https://code.jquery.com/jquery-3.5.1.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap.min.js"></script>
<script src="https://cdn.datatables.net/fixedheader/3.3.2/js/dataTables.fixedHeader.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.4.1/js/dataTables.responsive.min.js"></script>
<script src="https://cdn.datatables.net/responsive/2.4.1/js/responsive.bootstrap.min.js"></script>
<script>
    $(document).ready(function () {
        // Initialize DataTable
        var dataTable = $('#filtersTable').DataTable({
                responsive: true,
                columnDefs: [
                {
                    target: 3,
                    render: DataTable.render.datetime()
                }],
                order : [],
                ajax: {
                    url: '/contacts/list',
                    dataSrc: ''
                },
                columns: [
                    //{#{data: 'id'},#}
                    {data: 'name'},
                    {data: 'email'},
                    {
                        data: 'is_unsubscribed',
                        render : function (is_unsubscribed, type, row) {
                            var  label = ""
                            var id = row.id;
                            
                            var chekced = '';
                            checked = !is_unsubscribed ? 'checked' : '';
                            var publish_state = '<div class="form-check form-switch">' + 
                                                    '<input class="form-check-input" type="checkbox" id="flexSwitchCheckDefault' + id +'" ' + checked + '>' +
                                                '</div>';
                            return publish_state
                        }
                    },
                    {
                        data: 'id', // Assuming the id property is present in your data
                        render: function (id, type, row) {
                            // Create action buttons HTML
                            var filepath = '';
                            filepath = row.filepath;
                            var buttons = 
                                //'<a class="btn btn-facebook btn-sm" href="/' + filepath + '">Download</a> ' +
                                '<form style="display: contents" action="/service/delete" method="post"> <input type="hidden" name="serviceid" value="' + id + '"/><input class="btn btn-danger btn-sm" type="submit" value="Delete"></form>';
                            return buttons;
                        }
                    }
                ]
            },
        );

        $('#filtersTable').on('click', 'input', event => {
            let data = dataTable.row($(event.target).closest('tr')).data();
            var checkBox = document.getElementById("flexSwitchCheckDefault" + data.id)
            // console.log(data, checkBox.checked)
            var url = '';
            var unsubscribe_token = data.unsubscribe_token

            if (checkBox.checked) {
                url = "/subscribe/" + unsubscribe_token
            } else {
                url = "/unsubscribe/" + unsubscribe_token;
            }
            // Fetch action data
            fetch(url, {
                method: 'GET',
            }).then(response => {
                    if(!response.ok)
                        return response.text().then(text => { throw new Error(text) })
                    else
                        return response.text()
                })
                .then(data => {
                    //handle data
                    // console.log(data)
                    dataTable.ajax.reload();
                })
                .catch(error => {
                    //handle error
                    console.log(error);
                });

        });
    });
</script>
{% endblock javascripts %}
