{% extends 'layouts/base.html' %}

{% block title %} {% endblock title %}

<!-- Specific CSS goes HERE -->
{% block stylesheets %}{% endblock stylesheets %}

{% block content %}

    <div class="container-fluid py-4">
        <div class="container mt-5">
            <div class="card shadow-lg border-0 rounded-lg">
                <div class="card-header"><h3 class="text-center font-weight-light my-1">Search</h3></div>
                <div class="card-body">
                    <form method="post" action="{{ url_for('home_blueprint.url') }}">
                         <div class="form-group">
                            <label class="small mb-1" for="category">Business Type</label>
                            <input class="form-control py-1" id="business" name="business" type="text"
                                   placeholder="things to do, nail salons, plumbers, Live Music" required/>
                        </div>
                        <div class="form-group">
                            <label class="small mb-1" for="category">Location</label>
                            <input class="form-control py-1" id="location" name="location" type="text"
                                   placeholder="address, neighborhood, city, state or zip" required/>
                        </div>
                        <div class="form-group d-flex align-items-center justify-content-between mt-4 mb-0">
                            <button class="btn btn-danger" type="submit">Start Processes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        {% include "includes/footer.html" %}

    </div>

{% endblock content %}

<!-- Specific JS goes HERE -->
{% block javascripts %}

<script src="https://code.jquery.com/jquery-3.5.1.js"></script>
<script>
    
    $(document).ready(function () {
        // Create the autocomplete object, restricting the search to geographical location types.
        const autocomplete = new google.maps.places.Autocomplete(
            document.getElementById('location'),
            { 
                types: ['geocode'],
                componentRestrictions: { country: 'us' }    
             }
        );
    
        // When the user selects an address from the dropdown, populate the address fields in the form.
        autocomplete.addListener('place_changed', function() {
            const place = autocomplete.getPlace();
            // You can use the place object to get details like the address, coordinates, etc.
            console.log(place);
        });
    });


</script>
{% endblock javascripts %}
