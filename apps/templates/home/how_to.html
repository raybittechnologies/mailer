{% extends 'layouts/base.html' %}

{% block title %} Profile {% endblock title %}

<!-- Specific CSS goes HERE -->
{% block stylesheets %}
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
{% endblock stylesheets %}

{% block content %}

<div class="container-fluid">
    <div class="card card-body blur shadow-blur mx-4 mt-4 overflow-hidden">
        <div class="row gx-12">
            <div class="form-group">
                <div id="quilleditor" class="form-control" style="width: 100%;" required ></div>
            </div>
            <div class="form-group">
                <input type="text" class="form-control" id="howtotext_id" value="" name="howtotext_id" hidden>
            </div>
        </div>
    </div>
</div>

<div class="container-fluid py-4">
</div>

{% include "includes/footer.html" %}

{% endblock content %}

<!-- Specific JS goes HERE -->
{% block javascripts %}
<script src="https://code.jquery.com/jquery-3.5.1.js"></script>
<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
<script>

    $(document).ready(function () {

        fetch('/get_howto_text', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                },
        }).then(response => {
            if(!response.ok)
                return response.text().then(text => { throw new Error(text) })
            else
                return response.json()
        }).then(data => {
            console.log(data);
            document.getElementsByClassName("ql-editor")[0].innerHTML = data.text;

        }).catch(error => {
            console.error(error);
        });
        
        
        var quill = new Quill('#quilleditor', {
            theme: 'snow', 
            modules: {
                toolbar: false,
                //disable editing
            }
        });

        quill.enable(false);

    });
</script>


{% endblock javascripts %}
